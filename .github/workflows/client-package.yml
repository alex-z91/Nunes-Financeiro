name: Build Client Package

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/client-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create client ZIP
        run: |
          zip -r Nunes-Financeiro-final-cliente.zip .             -x ".git/*"                ".github/workflows/client-package.yml"                "Nunes-Financeiro-final-cliente.zip"

      - name: Upload client package
        uses: actions/upload-artifact@v4
        with:
          name: Nunes-Financeiro-final-cliente
          path: Nunes-Financeiro-final-cliente.zip
          retention-days: 7
