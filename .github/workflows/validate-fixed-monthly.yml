name: Validate Fixed Monthly

on:
  push:
    branches: ["main"]
    paths:
      - "js/**"
      - "tests/**"
      - "service-worker.js"
      - ".github/workflows/validate-fixed-monthly.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check js/finance.js
      - run: node --check js/app.js
      - run: npm test
