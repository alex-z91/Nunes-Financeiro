name: Validate Fixed Monthly
# desktop-quick-add-v21

on:
  push:
    branches: ["main"]
    paths:
      - "js/**"
      - "tests/**"
      - "service-worker.js"
      - ".github/workflows/validate-fixed-monthly.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check js/finance.js
      - run: node --check js/app.js
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8000 >/tmp/nunes-http.log 2>&1 &
      - run: npm run test:browser
